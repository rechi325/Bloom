<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Bloom Manager</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* ═══════════════════════════════════════════════════
   BLOOM MANAGER v7.5  —  APPLE MINIMAL LIGHT
   白背景 · SF Pro + ヒラギノ · 最低限の線
   ═══════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ── サーフェス ── */
  --bg0:#F2F2F7;          /* システム背景（iOS GroupedBackground） */
  --bg1:#FFFFFF;          /* カード・シート */
  --bg2:#E5E5EA;          /* セパレーター */
  --bg3:#C7C7CC;          /* 強めの枠 */
  --bg4:#F2F2F7;          /* 入力フィールド */

  /* ── テキスト ── */
  --tx1:#000000;          /* Primary */
  --tx2:#3C3C43;          /* Secondary（60%） */
  --tx3:#3C3C4399;        /* Tertiary */
  --tx4:#C7C7CC;          /* Placeholder */

  /* ── セマンティック（iOS準拠） ── */
  --r-bg:#FFF0F0;--r-tx:#FF3B30;
  --a-bg:#FFF8EC;--a-tx:#FF9500;
  --b-bg:#EEF4FF;--b-tx:#007AFF;
  --g-bg:#EDFAF3;--g-tx:#34C759;
  --gr-bg:#F2F2F7;--gr-tx:#8E8E93;

  /* ── アクセント：黒のみ（青不使用） ── */
  --ac:#000000;
  --ac-d:#1C1C1E;
  --ac-lt:#F2F2F7;
  --ac-mid:#E5E5EA;

  --r:12px;--rs:10px;--rx:100px;
  --nb-h:76px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --ic:#8E8E93;
}

/* ── フォント：SF Pro + ヒラギノ ── */
body{
  font-family:
    -apple-system,          /* SF Pro (iOS/macOS) */
    'SF Pro Text',
    'Hiragino Sans',        /* ヒラギノ角ゴ（iOS） */
    'Hiragino Kaku Gothic ProN',
    'Yu Gothic',sans-serif;
  font-size:14px;
  color:var(--tx1);
  background:var(--bg0);
  -webkit-tap-highlight-color:transparent;
  /* iOS のフォントレンダリングに合わせる */
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.ti{color:var(--ic)}
html,body{height:100%;overflow:hidden}
body.modal-open{overflow:hidden;position:fixed;width:100%}

/* ── APP ── */
.app{max-width:430px;margin:0 auto;height:100%;background:var(--bg0);display:flex;flex-direction:column;position:relative;overflow:hidden}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   NAV BAR  — Appleスタイルタブバー
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.nav-bar{
  flex-shrink:0;display:flex;
  background:rgba(249,249,249,0.94);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:0.5px solid var(--bg2);
  padding-bottom:var(--safe-b);
  z-index:30;
}
.nb{
  flex:1;
  padding:8px 2px 6px;
  text-align:center;
  font-size:10px;font-weight:500;
  letter-spacing:.01em;
  color:var(--tx3);
  cursor:pointer;border:none;background:none;font-family:inherit;
  border-top:none;
  transition:color .12s;line-height:1.2;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  min-height:var(--nb-h);gap:3px;
  padding-top:10px;padding-bottom:25px;
  -webkit-tap-highlight-color:transparent;
}
.nb i{font-size:24px;display:block;transition:transform .1s;color:inherit}
.nb.on{color:var(--ac);font-weight:600}
.nb.on i{transform:translateY(-1px)}
.nb-wrap{position:relative;display:inline-block}
.nb-badge{
  position:absolute;top:0;right:-3px;
  width:7px;height:7px;border-radius:50%;
  background:#FF3B30;border:1.5px solid rgba(249,249,249,0.94);
  display:none;
}
.nb-badge.show{display:block}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   PAGES
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.pages{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
.page.on{display:block}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   HEADER
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.hdr{
  background:rgba(249,249,249,0.94);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:0.5px solid var(--bg2);
  padding:16px 16px 0;
  position:sticky;top:0;z-index:10;
}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.logo{
  font-size:19px;font-weight:600;color:var(--tx1);
  display:flex;align-items:center;gap:8px;
  letter-spacing:-.5px;
  font-feature-settings:"kern";
}
.logo-mark{
  width:28px;height:28px;border-radius:7px;
  background:var(--tx1);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;flex-shrink:0;
}
.logo-sub{font-size:11px;font-weight:400;color:var(--tx3);letter-spacing:.02em}
.icon-btn{
  background:none;border:none;cursor:pointer;
  color:var(--ic);padding:6px;font-size:22px;
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  transition:opacity .1s;
}
.icon-btn:active{opacity:.5}
.icon-btn .ti{color:var(--ic)}
.hdr-actions{display:flex;align-items:center;gap:2px}
.sort-pill{
  display:flex;align-items:center;gap:3px;
  background:transparent;border:none;
  border-radius:var(--rx);padding:5px 10px;
  font-size:12px;font-weight:500;color:var(--tx2);
  cursor:pointer;font-family:inherit;transition:all .12s;
  letter-spacing:.01em;
}
.sort-pill i{font-size:13px}
.sort-pill.on{color:var(--tx1);font-weight:600}

/* ステータスタブ */
.stabs{
  display:flex;overflow-x:auto;gap:0;
  border-top:0.5px solid var(--bg2);
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.stabs::-webkit-scrollbar{display:none}
.stab{
  flex-shrink:0;padding:10px 12px;
  font-size:12px;font-weight:500;
  cursor:pointer;border:none;background:none;font-family:inherit;
  color:var(--tx3);
  border-bottom:1.5px solid transparent;
  white-space:nowrap;transition:all .12s;
  display:flex;align-items:center;gap:4px;
  letter-spacing:.01em;
}
.stab .cnt{
  font-size:10px;border-radius:20px;
  padding:0px 5px;font-weight:600;
  background:var(--bg4);color:var(--tx3);
}
.sa.on{color:var(--tx1);border-color:var(--tx1);font-weight:600}
.sa.on .cnt{background:var(--bg2);color:var(--tx1)}
.sn.on{color:var(--r-tx);border-color:var(--r-tx);font-weight:600}
.sn.on .cnt{background:var(--r-bg);color:var(--r-tx)}
.sd.on{color:var(--a-tx);border-color:var(--a-tx);font-weight:600}
.sd.on .cnt{background:var(--a-bg);color:var(--a-tx)}
.sw.on{color:var(--b-tx);border-color:var(--b-tx);font-weight:600}
.sw.on .cnt{background:var(--b-bg);color:var(--b-tx)}
.sp.on{color:var(--g-tx);border-color:var(--g-tx);font-weight:600}
.sp.on .cnt{background:var(--g-bg);color:var(--g-tx)}
.sk.on{color:var(--gr-tx);border-color:var(--gr-tx);font-weight:600}
.sk.on .cnt{background:var(--gr-bg);color:var(--gr-tx)}

/* ── MEDIA BADGES ── */
.med-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:6px;
  font-size:13px;
}
.med-x{background:#000;color:#fff}
.med-ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%);color:#fff}
.med-tk{background:#010101;color:#fff;border:1px solid #e5e5ea}
.med-yt{background:#FF0000;color:#fff}
.med-other{background:var(--bg4);color:var(--tx2);border:0.5px solid var(--bg3)}

/* ── ALERT BANNER ── */
.alert-banner{
  display:none;margin:12px 16px 0;padding:12px 14px;
  background:var(--a-bg);
  border-left:3px solid var(--a-tx);
  border-radius:var(--r);
}
.alert-banner.show{display:flex;align-items:flex-start;gap:10px}
.alert-icon{font-size:16px;flex-shrink:0;line-height:1.4}
.alert-body{flex:1;min-width:0}
.alert-title{font-size:12px;font-weight:600;color:var(--a-tx);margin-bottom:3px}
.alert-item{font-size:11px;color:var(--a-tx);opacity:.8;display:flex;align-items:center;gap:4px;margin-top:2px}
.alert-item::before{content:'·';font-size:16px;line-height:1}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   DEAL CARDS
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.deal-list{padding:8px 16px 20px}
.deal-card{
  background:var(--bg1);
  border-radius:var(--r);
  margin-bottom:8px;overflow:hidden;
  border:0.5px solid var(--bg2);
}
.deal-card:active{background:var(--bg4)}

.dc-top{display:flex;align-items:center;padding:13px 14px 9px}
.dc-dot{
  width:30px;height:30px;border-radius:50%;border:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;transition:transform .1s;
  -webkit-tap-highlight-color:transparent;
}
.dc-dot:active{transform:scale(.82)}
.dn{background:var(--r-bg);color:var(--r-tx)}
.dd{background:var(--a-bg);color:var(--a-tx)}
.dw{background:var(--b-bg);color:var(--b-tx)}
.dp{background:var(--g-bg);color:var(--g-tx)}
.dk{background:var(--gr-bg);color:var(--gr-tx)}

.dc-main{flex:1;padding:0 10px;min-width:0}
.dc-name{
  font-size:14px;font-weight:500;color:var(--tx1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:4px;letter-spacing:-.2px;
}
.dc-meta{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pill{
  display:inline-flex;align-items:center;
  padding:2px 7px;border-radius:20px;
  font-size:10px;font-weight:500;white-space:nowrap;
  letter-spacing:.02em;
}
.pn{background:var(--r-bg);color:var(--r-tx)}
.pd{background:var(--a-bg);color:var(--a-tx)}
.pw{background:var(--b-bg);color:var(--b-tx)}
.pp{background:var(--g-bg);color:var(--g-tx)}
.pk{background:var(--gr-bg);color:var(--gr-tx)}
.dl-ok{font-size:10px;color:var(--tx3)}
.dl-s{font-size:10px;color:var(--a-tx);font-weight:600}
.dl-u{font-size:10px;color:var(--r-tx);font-weight:600}

.dc-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.dc-amount{
  font-size:15px;font-weight:500;color:var(--tx1);
  letter-spacing:-.5px;
  font-feature-settings:"tnum";
}
.dc-draft-icon{font-size:10px;color:var(--tx3);display:flex;align-items:center;gap:2px}
.dc-draft-icon i{font-size:12px;color:var(--tx3)}
.dc-bottom{padding:0 14px 11px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.spbar{display:flex;align-items:center;gap:6px;flex:1}
.spt{flex:1;height:2px;background:var(--bg2);border-radius:2px;overflow:hidden;max-width:72px}
.spf{height:100%;background:var(--g-tx);border-radius:2px;transition:width .3s}
.spl{font-size:10px;color:var(--tx3)}
.dc-open-btn{
  font-size:12px;font-weight:500;color:var(--tx2);
  background:none;border:none;
  border-radius:0;padding:0;cursor:pointer;
  font-family:inherit;white-space:nowrap;
  display:flex;align-items:center;gap:2px;
}
.dc-open-btn::after{content:'›';font-size:16px;color:var(--tx3)}
.dc-open-btn:active{opacity:.5}
.sec-hd{
  padding:14px 16px 4px;
  font-size:11px;font-weight:600;color:var(--tx3);
  text-transform:uppercase;letter-spacing:.06em;
}
.rm{flex:1;padding:0 10px;min-width:0}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   MODAL / SHEET
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.modal-bg{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.35);
  z-index:50;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(2px);
}
.modal-bg.on{display:flex}
.sheet{
  background:var(--bg1);
  border-radius:16px 16px 0 0;
  width:100%;max-width:430px;overflow:hidden;
}
.sh{width:36px;height:4px;background:var(--bg3);border-radius:2px;margin:10px auto 6px}
.shd{
  padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:0.5px solid var(--bg2);
}
.sht{font-size:16px;font-weight:500;color:var(--tx1);letter-spacing:-.3px}
.shb{padding:0 16px 16px;max-height:78vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.shf{
  padding:10px 16px;border-top:0.5px solid var(--bg2);
  display:flex;gap:8px;justify-content:flex-end;background:var(--bg1);
}

/* ── DETAIL ROWS ── */
.drow{
  display:flex;align-items:flex-start;min-height:44px;
  border-bottom:0.5px solid var(--bg2);
  gap:10px;padding:7px 0;
}
.drow:last-child{border-bottom:none}
.dlbl{
  font-size:11px;color:var(--tx3);width:72px;
  flex-shrink:0;font-weight:500;padding-top:8px;
  letter-spacing:.02em;
}
.dval{flex:1;font-size:14px;color:var(--tx1)}
.dval input,.dval select,.dval textarea{
  width:100%;background:var(--bg4);
  border:none;border-radius:var(--rs);
  padding:8px 10px;font-size:14px;color:var(--tx1);
  font-family:inherit;-webkit-appearance:none;
}
.dval input:focus,.dval select:focus,.dval textarea:focus{
  outline:none;background:var(--bg2);
}
.dval textarea{min-height:54px;resize:none}
.st-select-wrap{position:relative}
.st-select-wrap select{
  width:100%;border-radius:8px;
  padding:8px 28px 8px 10px;font-weight:600;
  -webkit-appearance:none;cursor:pointer;border:none;
}
.st-select-wrap::after{
  content:'';position:absolute;right:10px;top:50%;
  transform:translateY(-50%);
  border:4px solid transparent;border-top-color:var(--tx3);
  pointer-events:none;margin-top:3px;
}
.st-sel-new{background:var(--r-bg)!important;color:var(--r-tx)!important}
.st-sel-draft{background:var(--a-bg)!important;color:var(--a-tx)!important}
.st-sel-wait{background:var(--b-bg)!important;color:var(--b-tx)!important}
.st-sel-posted{background:var(--g-bg)!important;color:var(--g-tx)!important}
.st-sel-paid{background:var(--gr-bg)!important;color:var(--gr-tx)!important}

/* ── SUBTASK ── */
.sub-sec{padding:4px 0 8px}
.sub-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 0 8px}
.sub-hl{
  font-size:11px;font-weight:600;color:var(--tx3);
  text-transform:uppercase;letter-spacing:.05em;
  display:flex;align-items:center;gap:5px;
}
.sub-hl i{font-size:12px}
.sub-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--bg2)}
.sub-row:last-child{border-bottom:none}
.sub-ck{
  width:22px;height:22px;border-radius:50%;
  border:1.5px solid var(--bg3);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;background:transparent;transition:all .15s;
}
.sub-ck.on{background:var(--g-tx);border-color:var(--g-tx)}
.sub-ck i{font-size:12px;color:#fff;opacity:0;transition:opacity .15s}
.sub-ck.on i{opacity:1}
.sub-nm{font-size:13px;font-weight:400;color:var(--tx1);transition:all .15s}
.sub-nm.on{text-decoration:line-through;color:var(--tx3)}
.sub-dl{font-size:10px;color:var(--tx3);margin-top:2px}
.sub-del{background:none;border:none;color:var(--tx4);cursor:pointer;padding:5px;font-size:14px;display:flex;align-items:center;flex-shrink:0}
.sub-add{
  display:flex;gap:7px;margin-top:10px;padding-top:10px;
  border-top:0.5px solid var(--bg2);align-items:center;flex-wrap:wrap;
}
.sub-add .si{
  flex:1;min-width:110px;background:var(--bg4);border:none;
  border-radius:8px;padding:8px 10px;font-size:13px;
  color:var(--tx1);font-family:inherit;
}
.sub-add .sd2{
  width:130px;background:var(--bg4);border:none;
  border-radius:8px;padding:8px 10px;font-size:13px;
  color:var(--tx1);font-family:inherit;-webkit-appearance:none;
}
.sub-add .si:focus,.sub-add .sd2:focus{outline:none;background:var(--bg2)}

/* ── DEAL DRAFT ── */
.deal-draft-sec{margin-top:4px;padding:4px 0 6px}
.deal-draft-hd{
  font-size:11px;font-weight:600;color:var(--tx3);
  text-transform:uppercase;letter-spacing:.05em;
  padding:12px 0 10px;display:flex;align-items:center;gap:5px;
}
.deal-draft-hd i{font-size:12px}
.deal-draft-area{background:var(--bg4);border-radius:var(--rs);padding:10px}
.deal-draft-ta{
  width:100%;background:transparent;border:none;
  padding:6px 4px;font-size:14px;color:var(--tx1);
  font-family:inherit;resize:none;min-height:100px;line-height:1.6;
}
.deal-draft-ta:focus{outline:none}
.deal-draft-ta::placeholder{color:var(--tx4)}
.draft-char-row{display:flex;align-items:center;justify-content:space-between;margin-top:7px}
.draft-char{font-size:11px;font-weight:500}
.draft-char.ok{color:var(--tx3)}.draft-char.warn{color:var(--a-tx)}.draft-char.over{color:var(--r-tx)}
.draft-img-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.draft-img-wrap{position:relative;width:66px;height:66px;flex-shrink:0}
.draft-img-wrap img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.draft-img-del{
  position:absolute;top:-5px;right:-5px;
  width:18px;height:18px;border-radius:50%;
  background:#FF3B30;border:1.5px solid var(--bg1);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:10px;cursor:pointer;border:none;
}
.draft-img-add{
  width:66px;height:66px;border-radius:8px;
  border:0.5px solid var(--bg3);background:var(--bg4);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
}
.draft-img-add i{font-size:22px;color:var(--tx4)}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   FORMS
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.fg{margin-bottom:14px}
.fg label{
  display:block;font-size:11px;font-weight:600;color:var(--tx3);
  letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px;
}
.fg input,.fg select,.fg textarea{
  width:100%;background:var(--bg4);border:none;

<script>
/* ══════════════════════════════════════════════════
   BLOOM MANAGER v7.0
   ══════════════════════════════════════════════════ */

/* ── STORAGE KEYS ── */
/* ── STORAGE KEYS
   キー名は固定。GitHub Pages等で同一URLを使い続けても
   localStorageはoriginで分離されるため、データは保持される。
   キー変更時は下記 MIGRATION セクションで旧→新に移行する。 ── */
const SKEY={
  deals:'bm_deals_v3', cos:'bm_cos_v2', gifts:'bm_gifts_v2',
  banks:'bm_banks_v2', settings:'bm_settings_v3', apikey:'bm_apikey',
  backup:'bm_backup_v1'   // JSONバックアップのタイムスタンプ保存用
};

/* ── STATUS ── */
const SK=['new','draft','wait','posted','paid'];
const SL={new:'未着手',draft:'初稿中',wait:'投稿待ち',posted:'投稿完了',paid:'入金完了'};
const SD={new:'dn',draft:'dd',wait:'dw',posted:'dp',paid:'dk'};
const SP={new:'pn',draft:'pd',wait:'pw',posted:'pp',paid:'pk'};
const SI={new:'ti-circle',draft:'ti-pencil',wait:'ti-clock',posted:'ti-circle-check',paid:'ti-coin'};
const SCLS={new:'st-sel-new',draft:'st-sel-draft',wait:'st-sel-wait',posted:'st-sel-posted',paid:'st-sel-paid'};
const MEDIA_LABEL={X:'𝕏 X',Instagram:'📸 Instagram',TikTok:'♪ TikTok',YouTube:'▶ YouTube','複数・その他':'⊕ 複数・他'};
const MEDIA_CLS={X:'med-x',Instagram:'med-ig',TikTok:'med-tk',YouTube:'med-yt','複数・その他':'med-other'};
const DEFAULT_BANKS=[{id:1,name:'ゆうちょ銀行',branch:'',memo:''},{id:2,name:'GMOあおぞら銀行',branch:'',memo:''},{id:3,name:'三井住友銀行',branch:'',memo:''}];
const MAX_CHARS=140;

/* ── HELPERS ── */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fa=n=>n?'¥'+Number(n).toLocaleString():'¥0';
const fd=d=>{if(!d)return'—';const t=new Date(d+'T00:00:00');return`${t.getMonth()+1}/${t.getDate()}`};
const gd=dl=>{if(!dl)return null;const d=new Date(dl+'T00:00:00');d.setHours(0,0,0,0);const n=new Date();n.setHours(0,0,0,0);return Math.round((d-n)/864e5)};
const today=()=>{const t=new Date();return`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`};

let _tid=null;
function T(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(_tid);_tid=setTimeout(()=>e.classList.remove('show'),2200);}

function dlb(dl,done){
  if(done)return`<span class="dl-ok">${fd(dl)}</span>`;if(!dl)return'';
  const d=gd(dl);if(d===null)return'';
  if(d<0)return`<span class="dl-u">期限超過</span>`;
  if(d===0)return`<span class="dl-u">今日締切</span>`;
  if(d<=3)return`<span class="dl-s">あと${d}日</span>`;
  return`<span class="dl-ok">${fd(dl)}</span>`;
}

/* localStorage はブラウザのorigin（スキーム+ホスト+ポート）に紐づき、
   同一URLでのページ更新・GitHub Pagesでのコード差し替えでもデータは消えない。
   ※ キー名を変えた場合のみ旧データが参照不能になるため、SKEY は慎重に管理する。 */
function save(k,v){
  try{localStorage.setItem(k,JSON.stringify(v));}
  catch(e){console.warn('Storage write failed:',k,e);}
}
function load(k,d){
  try{
    const v=localStorage.getItem(k);
    return v!==null?JSON.parse(v):d;
  }catch(e){
    console.warn('Storage read failed:',k,e);
    return d;
  }
}

/* Draft input handler */
function onDraftInput(id){
  const ta=document.getElementById(`dd-ta-${id}`);if(!ta)return;
  const n=[...ta.value].length;
  const cl=n>MAX_CHARS?'over':n>MAX_CHARS*0.9?'warn':'ok';
  const cnt=document.getElementById(`dd-cnt-${id}`);
  if(cnt){cnt.textContent=`${n}/${MAX_CHARS}`;cnt.className=`draft-char ${cl}`;}
}
function addDraftImgs(id,input){
  const d=deals.find(x=>x.id===id);if(!d)return;
  Array.from(input.files).forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      if(!d.draftImgs)d.draftImgs=[];
      const idx=d.draftImgs.length;
      d.draftImgs.push(ev.target.result);
      const row=document.getElementById(`dd-imgs-${id}`);
      if(row){
        const wrap=document.createElement('div');
        wrap.className='draft-img-wrap';wrap.id=`dimg-${id}-${idx}`;
        wrap.innerHTML=`<img src="${ev.target.result}" alt=""><button class="draft-img-del" onclick="delDraftImg(${id},${idx})"><i class="ti ti-x" style="font-size:10px"></i></button>`;
        row.insertBefore(wrap,row.lastElementChild);
      }
    };
    reader.readAsDataURL(file);
  });
  input.value='';
}
function delDraftImg(id,idx){
  const d=deals.find(x=>x.id===id);if(!d||!d.draftImgs)return;
  d.draftImgs.splice(idx,1);
  // Re-render image row
  const row=document.getElementById(`dd-imgs-${id}`);
  if(row){
    const label=row.lastElementChild;
    row.innerHTML='';
    (d.draftImgs||[]).forEach((src,i)=>{
      const wrap=document.createElement('div');
      wrap.className='draft-img-wrap';wrap.id=`dimg-${id}-${i}`;
      wrap.innerHTML=`<img src="${src}" alt=""><button class="draft-img-del" onclick="delDraftImg(${id},${i})"><i class="ti ti-x" style="font-size:10px"></i></button>`;
      row.appendChild(wrap);
    });
    row.appendChild(label);
  }
}

function _rsc(did){
  const d=deals.find(x=>x.id===did);if(!d)return;
  const el=document.getElementById(`sub-cnt-${did}`);
  if(el)el.textContent=`${d.subs.filter(s=>s.done).length}/${d.subs.length}件完了`;
  rDeals();
}
function togS(did,sid){
  const d=deals.find(x=>x.id===did);if(!d)return;
  const s=d.subs.find(x=>x.id===sid);if(!s)return;
  s.done=!s.done;saveAll();
  const r=document.getElementById(`sr-${did}-${sid}`);
  if(r){r.querySelector('.sub-ck').classList.toggle('on',s.done);r.querySelector('.sub-nm').classList.toggle('on',s.done);}
  _rsc(did);
}
function delS(did,sid){
  const d=deals.find(x=>x.id===did);if(!d)return;
  d.subs=d.subs.filter(x=>x.id!==sid);saveAll();
  const r=document.getElementById(`sr-${did}-${sid}`);if(r)r.remove();
  _rsc(did);T('削除しました');
}
function addS(did){
  const d=deals.find(x=>x.id===did);if(!d)return;
  const nm=document.getElementById(`si-n-${did}`).value.trim();if(!nm){T('タスク名を入力してください');return;}
  const dl=document.getElementById(`si-d-${did}`).value;
  const s={id:nsi++,name:nm,dl,done:false};d.subs.push(s);saveAll();
  document.getElementById(`si-n-${did}`).value='';document.getElementById(`si-d-${did}`).value='';
  const slEl=document.getElementById(`sl-${did}`);
  if(slEl)slEl.insertAdjacentHTML('beforeend',`<div class="sub-row" id="sr-${did}-${s.id}">
    <button class="sub-ck" onclick="togS(${did},${s.id})"><i class="ti ti-check"></i></button>
    <div style="flex:1"><div class="sub-nm">${esc(s.name)}</div><div class="sub-dl">${dl?fd(dl):''}</div></div>
    <button class="sub-del" onclick="delS(${did},${s.id})"><i class="ti ti-x"></i></button>
  </div>`);
  _rsc(did);T('タスクを追加しました');
}
function saveE(id){
  const d=deals.find(x=>x.id===id);if(!d)return;
  d.st=document.getElementById('e-st').value;
  d.cid=parseInt(document.getElementById('e-co').value);
  d.name=document.getElementById('e-nm').value.trim()||d.name;
  d.media=document.getElementById('e-md').value;

  d.prodSt=document.getElementById('e-pr').value;

  saveAll();closeModal('m-det');bTabs();rDeals();rDash();T('保存しました ✓');
}
function delD(id){
  if(!confirm('この案件を削除しますか？'))return;
  deals=deals.filter(x=>x.id!==id);saveAll();closeModal('m-det');bTabs();rDeals();rDash();T('削除しました');

以下のDM文章から情報を抽出し、JSONのみを返してください（コードブロック・前置き・説明文不要）。

function localParse(text){
  const res={};
  // Amount
  const amM=text.match(/(?:報酬|謝礼|金額|お支払い)[^\d]*?([\d,，]+)\s*円/)||text.match(/([\d,，]+)\s*円/);
  if(amM)res.amount=parseInt(amM[1].replace(/[,，]/g,''));
  // Media
  if(/instagram|インスタ/i.test(text))res.media='Instagram';
  else if(/tiktok|ティックトック/i.test(text))res.media='TikTok';
  else if(/youtube|ユーチューブ/i.test(text))res.media='YouTube';
  else if(/twitter|ツイッター|^x\b/i.test(text))res.media='X';
  // Dates
  const yr=new Date().getFullYear();
  const dateRepl=(s)=>{
    const m=s.match(/(\d{1,2})[\/月](\d{1,2})/);
    if(m)return`${yr}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
    return null;
  };
  const draftM=text.match(/(?:初稿|ドラフト|第一稿)[^\d]*?(\d{1,2}[\/月]\d{1,2})/);
  if(draftM)res.draftDl=dateRepl(draftM[1]);
  const postM=text.match(/(?:投稿|公開|配信)[^\d]*?(\d{1,2}[\/月]\d{1,2})/);
  if(postM)res.postDl=dateRepl(postM[1]);
  // Brand: look for katakana sequences or caps words
  const bM=text.match(/(?:ブランド|商品名|PR[：:]\s*|案件[：:])\s*([^\n。、,，]+)/);
  if(bM)res.brand=bM[1].trim().slice(0,40);
  return Object.keys(res).length>0?res:null;
}

  if(p.draftDl){const dd=document.getElementById('fa-dd');if(dd&&!dd.value)dd.value=p.draftDl;}

}

function localParseGift(text){
  const res={};
  const ref=new Date();const yr=ref.getFullYear();
  const toISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const parseD=(s)=>{
    if(/月末/.test(s))return toISO(new Date(yr,ref.getMonth()+1,0));
    if(/来週/.test(s)){const t=new Date(ref);t.setDate(t.getDate()+7);return toISO(t);}
    const m=s.match(/(\d{1,2})[月\/](\d{1,2})/);
    if(m)return`${yr}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
    return null;
  };
  const bm=text.match(/(?:ブランド|企業)[：:]\s*([^\n。、]+)/);if(bm)res.brand=bm[1].trim().slice(0,40);
  const nm=text.match(/(?:商品名?|製品)[：:]\s*([^\n。、]+)/);if(nm)res.name=nm[1].trim().slice(0,60);
  if(/投稿必須|必須|必ず/.test(text))res.must='must';
  else if(/投稿推奨|任意|できれば/.test(text))res.must='hope';
  else if(/投稿不要|不要/.test(text))res.must='none';
  const am=text.match(/(?:到着|お届け)[^\d月\/]*([^\n。]{2,10})/);if(am){const d=parseD(am[1]);if(d)res.arr=d;}
  const pm=text.match(/(?:投稿|掲載)[^\d月\/]*([^\n。]{2,10})/);if(pm){const d=parseD(pm[1]);if(d)res.postdate=d;}
  const tags=text.match(/#[^\s#]+/g);if(tags)res.note=tags.join(' ');
  return Object.keys(res).length>0?res:null;
}

  const td=today();
  const dows=['日','月','火','水','木','金','土'];
  document.getElementById('cal-dow').innerHTML=dows.map((d,i)=>`<div class="cal-dow" style="${i===0?'color:var(--r-tx)':i===6?'color:var(--b-tx)':''}">${d}</div>`).join('');
  const first=new Date(calY,calM,1),last=new Date(calY,calM+1,0);
  const startDow=first.getDay(),total=Math.ceil((startDow+last.getDate())/7)*7;
  const evMap={};
  deals.forEach(d=>{
    if(d.draftDl)addEv(evMap,d.draftDl,{deal:d,type:'draft',label:`初稿: ${d.name}`});
    if(d.postDl)addEv(evMap,d.postDl,{deal:d,type:'post',label:`投稿締切: ${d.name}`});
    if(d.paydl)addEv(evMap,d.paydl,{deal:d,type:'pay',label:`入金: ${d.name}`});
    (d.subs||[]).filter(s=>s.dl&&!s.done).forEach(s=>addEv(evMap,s.dl,{deal:d,type:'sub',label:`${d.name}／${s.name}`}));
  });
  gifts.forEach(g=>{if(g.postdate)addEv(evMap,g.postdate,{gift:g,type:'gift',label:`🎁 投稿: ${g.brand} ${g.name}`});});
  let cells='';
  for(let i=0;i<total;i++){
    const dayNum=i-startDow+1,isThisM=dayNum>=1&&dayNum<=last.getDate();
    const dateStr=isThisM?`${calY}-${String(calM+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`:'';
    const dow=i%7,isToday=dateStr===td;
    const cls=['cal-cell',!isThisM?'other-m':'',isToday?'today':'',dow===0?'sun':dow===6?'sat':''].filter(Boolean).join(' ');
    const evs=dateStr?evMap[dateStr]||[]:[];
    const dots=evs.slice(0,4).map(ev=>{const dc=ev.type==='draft'?'cal-dot-draft':ev.type==='post'?'cal-dot-new':ev.type==='pay'?'cal-dot-paid':ev.type==='sub'?'cal-dot-draft':'cal-dot-posted';return`<div class="cal-dot ${dc}"></div>`;}).join('');
    const cnt=evs.length>4?`<div class="cal-count">+${evs.length-4}</div>`:'';
    const click=dateStr&&evs.length?`onclick="openDay('${dateStr}')"`:'';
    cells+=`<div class="${cls}" ${click}><div class="cal-dn">${isThisM?dayNum:''}</div><div class="cal-dots">${dots}</div>${cnt}</div>`;
  }
  document.getElementById('cal-grid').innerHTML=cells;
  if(evMap[td]&&new Date().getFullYear()===calY&&new Date().getMonth()===calM)showDaySheet(td,evMap[td]);
  else document.getElementById('cal-day-sheet').innerHTML='<div style="padding:10px 0;font-size:12px;color:var(--tx3)">日付をタップするとスケジュールが表示されます</div>';
}
function addEv(map,date,ev){if(!date)return;if(!map[date])map[date]=[];map[date].push(ev);}
function openDay(dateStr){
  const evMap={};
  deals.forEach(d=>{
    if(d.draftDl)addEv(evMap,d.draftDl,{deal:d,type:'draft',label:'初稿締切',sub:d.name});
    if(d.postDl)addEv(evMap,d.postDl,{deal:d,type:'post',label:'投稿締切',sub:d.name});
    if(d.paydl)addEv(evMap,d.paydl,{deal:d,type:'pay',label:'入金予定',sub:`${d.name}・${fa(d.amount)}`});
    (d.subs||[]).filter(s=>s.dl&&!s.done).forEach(s=>addEv(evMap,s.dl,{deal:d,type:'sub',label:s.name,sub:d.name}));
  });
  gifts.forEach(g=>{if(g.postdate)addEv(evMap,g.postdate,{gift:g,type:'gift',label:'🎁 ギフト投稿',sub:`${g.brand} ${g.name}`});});
  const evs=evMap[dateStr]||[];
  showDaySheet(dateStr,evs);
  if(window.innerWidth<=430){
    const d=new Date(dateStr+'T00:00:00');
    document.getElementById('day-drawer-ttl').textContent=`${d.getMonth()+1}月${d.getDate()}日`;
    document.getElementById('day-drawer-body').innerHTML=buildDayHTML(evs)||'<div class="empty" style="padding:1rem">予定はありません</div>';
    document.getElementById('day-drawer').style.display='block';
    document.getElementById('day-bg').classList.add('on');
  }
}
function showDaySheet(dateStr,evs){
  const d=new Date(dateStr+'T00:00:00');
  document.getElementById('cal-day-sheet').innerHTML=`<div class="cal-day-ttl">${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）</div>${buildDayHTML(evs)||'<div style="font-size:12px;color:var(--tx3)">予定はありません</div>'}`;

function buildDayHTML(evs){

  const bg={draft:'var(--a-bg)',post:'var(--r-bg)',pay:'var(--g-bg)',sub:'var(--b-bg)',gift:'var(--ac-lt)'};
  return evs.map(ev=>{
    const c=tc[ev.type]||'var(--tx2)',b=bg[ev.type]||'var(--bg4)';
    const id=ev.deal?ev.deal.id:0;
    return`<div class="cal-event" style="background:${b}" ${id?`onclick="oDet(${id})"`:''}>

}

/* ── JSON インポート（復元）── */
function importJSON(input){
  const file=input.files[0];if(!file)return;
  if(!confirm(`「${file.name}」を読み込みます。現在のデータはすべて上書きされます。よろしいですか？`)){
    input.value='';return;
  }
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      // バリデーション
      if(!data._version&&!data.deals&&!data.cos){
        T('ファイルの形式が正しくありません');input.value='';return;
      }
      if(Array.isArray(data.deals)){
        deals=data.deals;
        // フィールド安全補完
        deals.forEach(d=>{
          if(d.draftText==null)d.draftText='';
          if(!Array.isArray(d.draftImgs))d.draftImgs=[];
          if(!Array.isArray(d.subs))d.subs=[];
          if(d.draftDl==null)d.draftDl='';
          if(d.postDl==null)d.postDl='';
          if(d.paydl==null)d.paydl='';
          delete d.draftSched;
        });
        save(SKEY.deals,deals);
      }
      if(Array.isArray(data.cos)){cos=data.cos;save(SKEY.cos,cos);}
      if(Array.isArray(data.gifts)){
        gifts=data.gifts;
        gifts.forEach(g=>{if(!g.must)g.must='none';if(g.postdate==null)g.postdate='';if(g.note==null)g.note='';});
        save(SKEY.gifts,gifts);
      }
      if(Array.isArray(data.banks)){banks=data.banks;save(SKEY.banks,banks);}
      if(data.settings&&typeof data.settings==='object'){settings={...settings,...data.settings};saveSettings();}
      // IDカウンター再計算
      nci=cos.length?Math.max(...cos.map(x=>x.id))+1:1;
      ndi=deals.length?Math.max(...deals.map(x=>x.id))+1:1;
      ngi=gifts.length?Math.max(...gifts.map(x=>x.id))+1:1;
      nbi=banks.length?Math.max(...banks.map(x=>x.id))+1:4;
      const allS=deals.flatMap(d=>d.subs||[]);
      nsi=allS.length?Math.max(...allS.map(x=>x.id))+1:1;
      // 画面更新
      bTabs();rDeals();rDash();rGift();rBanks();rCo();rSettings();rStorageStatus();
      T(`データを復元しました（案件${deals.length}件）✓`);
    }catch(e){
      console.error('Import error',e);
      T('読み込みエラー：ファイルを確認してください');
    }
    input.value='';
  };
  reader.readAsText(file,'UTF-8');
}

/* ── ストレージ状態表示 ── */
function rStorageStatus(){
  const el=document.getElementById('storage-status');
  if(!el){console.warn('storage-status element not found');return;}
  let total=0;
  const rows=Object.entries(SKEY).map(([k,v])=>{
    const val=localStorage.getItem(v)||'';
    const bytes=new Blob([val]).size;
    total+=bytes;
    if(k==='apikey')return`<div style="display:flex;justify-content:space-between"><span>${k}</span><span style="color:var(--tx3)">保存済み</span></div>`;
    const cnt=k==='backup'?'':` / ${JSON.parse(val||'[]')?.length||'-'}件`;
    const kb=(bytes/1024).toFixed(1);
    return`<div style="display:flex;justify-content:space-between"><span>${k}</span><span style="color:var(--tx3)">${kb} KB${cnt}</span></div>`;
  });
  const lastBackup=load(SKEY.backup,null);
  const lbStr=lastBackup?`最終バックアップ: ${lastBackup.slice(0,10)}`:'バックアップ未作成';
  el.innerHTML=rows.join('')+`<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--bg2);color:var(--ac);font-weight:700">合計: ${(total/1024).toFixed(1)} KB　｜　${lbStr}</div>`;
}

    return`<div class="bank-row" draggable="true" data-bank-id="${b.id}">
      <div class="bank-handle" title="長押しで並べ替え"><i class="ti ti-grip-vertical" style="pointer-events:none"></i></div>
      <div class="bank-icon">${esc(b.name.slice(0,1)||'B')}</div>
      <div class="bank-info"><div class="bank-name">${esc(b.name)}${b.branch?`<span style="font-size:11px;color:var(--tx2);font-weight:400;margin-left:4px">${esc(b.branch)}</span>`:''}</div>
        ${b.memo?`<div class="bank-sub">${esc(b.memo)}</div>`:''}${used?`<div class="bank-sub">${used}件で使用中</div>`:''}
      </div>
      <button class="bank-del" onclick="delBank(${b.id})"><i class="ti ti-trash" style="font-size:15px"></i></button>
    </div>`;
  }).join('');
  initBankDrag();
}

/* ── 銀行ドラッグ並べ替え（PC:DnD / スマホ:Touch） ── */
function initBankDrag(){
  const list=document.getElementById('bank-list');
  if(!list)return;
  const rows=()=>[...list.querySelectorAll('.bank-row')];

  /* ── PC: HTML5 Drag and Drop ── */
  let dragSrc=null;
  list.addEventListener('dragstart',e=>{
    dragSrc=e.target.closest('.bank-row');
    if(!dragSrc)return;
    dragSrc.classList.add('dragging');
    e.dataTransfer.effectAllowed='move';
  });
  list.addEventListener('dragover',e=>{
    e.preventDefault();
    e.dataTransfer.dropEffect='move';
    const over=e.target.closest('.bank-row');
    if(!over||over===dragSrc)return;
    rows().forEach(r=>r.classList.remove('drag-over'));
    over.classList.add('drag-over');
  });
  list.addEventListener('dragleave',e=>{
    const over=e.target.closest('.bank-row');
    if(over)over.classList.remove('drag-over');
  });
  list.addEventListener('dragend',e=>{
    rows().forEach(r=>{r.classList.remove('dragging');r.classList.remove('drag-over');});
  });
  list.addEventListener('drop',e=>{
    e.preventDefault();
    const over=e.target.closest('.bank-row');
    if(!over||!dragSrc||over===dragSrc)return;
    // DOM上の順序から banks 配列を並べ替え
    const overIdx=rows().indexOf(over);
    list.insertBefore(dragSrc,overIdx>rows().indexOf(dragSrc)?over.nextSibling:over);
    saveBankOrder();
    rows().forEach(r=>{r.classList.remove('dragging');r.classList.remove('drag-over');});
  });

  /* ── スマホ: Touch Events ── */
  let touchRow=null,touchClone=null,touchStartY=0,touchOffsetY=0;
  list.addEventListener('touchstart',e=>{
    const handle=e.target.closest('.bank-handle');
    if(!handle)return;
    touchRow=handle.closest('.bank-row');
    if(!touchRow)return;
    e.preventDefault();
    const t=e.touches[0];
    const rect=touchRow.getBoundingClientRect();
    touchOffsetY=t.clientY-rect.top;
    touchStartY=t.clientY;
    // 浮かせるクローン作成
    touchClone=touchRow.cloneNode(true);
    touchClone.style.cssText=`position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;z-index:999;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.18);border-radius:var(--rs);background:#fff;opacity:.96;`;
    document.body.appendChild(touchClone);
    touchRow.style.opacity='.3';
  },{passive:false});

  list.addEventListener('touchmove',e=>{
    if(!touchRow||!touchClone)return;
    e.preventDefault();
    const t=e.touches[0];
    touchClone.style.top=(t.clientY-touchOffsetY)+'px';
    // どの行の上にいるか判定
    rows().forEach(r=>r.classList.remove('drag-over'));
    const els=document.elementsFromPoint(t.clientX,t.clientY);
    const over=els.find(el=>el.classList&&el.classList.contains('bank-row')&&el!==touchRow);
    if(over)over.classList.add('drag-over');
  },{passive:false});

  list.addEventListener('touchend',e=>{
    if(!touchRow||!touchClone)return;
    const t=e.changedTouches[0];
    const els=document.elementsFromPoint(t.clientX,t.clientY);
    const over=els.find(el=>el.classList&&el.classList.contains('bank-row')&&el!==touchRow);
    if(over){
      const allRows=rows();
      const overIdx=allRows.indexOf(over);
      const srcIdx=allRows.indexOf(touchRow);
      list.insertBefore(touchRow,overIdx>srcIdx?over.nextSibling:over);
      saveBankOrder();
    }
    touchClone.remove();touchClone=null;
    touchRow.style.opacity='';touchRow=null;
    rows().forEach(r=>r.classList.remove('drag-over'));
    T('順番を保存しました');
  });
}

function saveBankOrder(){
  const list=document.getElementById('bank-list');
  if(!list)return;
  const newOrder=[...list.querySelectorAll('.bank-row')].map(r=>parseInt(r.dataset.bankId));
  banks=newOrder.map(id=>banks.find(b=>b.id===id)).filter(Boolean);
  saveAll();
}
function addBank(){
  const nm=document.getElementById('fb-name').value.trim();if(!nm){T('銀行名は必須です');return;}
  banks.push({id:nbi++,name:nm,branch:document.getElementById('fb-branch').value.trim(),memo:document.getElementById('fb-memo').value.trim()});
  saveAll();['fb-name','fb-branch','fb-memo'].forEach(i=>document.getElementById(i).value='');rBanks();T('銀行を追加しました');
}
function delBank(id){
  const b=banks.find(x=>x.id===id);if(!b)return;
  const used=deals.filter(d=>d.bank===b.name).length;
  if(used>0){T(`${used}件の案件で使用中です`);return;}
  if(!confirm(`「${b.name}」を削除しますか？`))return;
  banks=banks.filter(x=>x.id!==id);saveAll();rBanks();T('削除しました');
}

/* ══════════ REMINDER ══════════ */
function urgentDeals(days=1){
  return deals.filter(d=>{
    if(d.st==='paid')return false;
    const dl=d.postDl||d.draftDl||d.paydl;if(!dl)return false;
    const diff=gd(dl);return diff!==null&&diff>=0&&diff<=days;
  });
}
function updateDealAlert(){
  const urgent=urgentDeals(1);
  const banner=document.getElementById('deal-alert');
  const items=document.getElementById('alert-items');
  const badge=document.getElementById('deal-badge');
  if(!banner)return;
  if(!urgent.length){banner.classList.remove('show');if(badge)badge.classList.remove('show');return;}
  banner.classList.add('show');
  if(badge)badge.classList.add('show');
  if(items)items.innerHTML=urgent.map(d=>{
    const dl=d.postDl||d.draftDl||d.paydl;
    const diff=gd(dl);
    const when=diff===0?'今日締切':`明日締切（${fd(dl)}）`;
    return`<div class="alert-item">${esc(d.name)} — <strong>${when}</strong></div>`;
  }).join('');
}
function updateNotifLabel(){
  const el=document.getElementById('notif-label');const btn=document.getElementById('notif-btn');if(!el||!btn)return;
  if(!('Notification' in window)){el.textContent='通知はこのブラウザで非対応';btn.style.opacity='.5';btn.style.pointerEvents='none';return;}
  if(Notification.permission==='granted'){el.textContent='ブラウザ通知：有効 ✓';btn.style.background='var(--g-bg)';btn.style.borderColor='var(--g-bg)';btn.style.color='var(--g-tx)';}
  else if(Notification.permission==='denied'){el.textContent='通知がブロックされています';btn.style.opacity='.6';}
}
function requestNotifPerm(){
  if(!('Notification' in window)){T('このブラウザは通知に非対応です');return;}
  if(Notification.permission==='granted'){
    urgentDeals(1).forEach(d=>{
      const dl=d.postDl||d.draftDl||d.paydl;
      try{new Notification('Bloom Manager ⚠️',{body:`「${d.name}」の期限（${fd(dl)}）が迫っています`});}catch(e){}
    });
    return;
  }
  Notification.requestPermission().then(p=>{updateNotifLabel();if(p==='granted')T('通知を許可しました ✓');else T('通知が許可されませんでした');});
}

/* ══════════ PAGE NAV ══════════ */
const ALL_PAGES=['deals','dash','cal','gift','more'];
function sp(p){
  ALL_PAGES.forEach(x=>{
    document.getElementById('pg-'+x).classList.toggle('on',x===p);
    document.getElementById('nb-'+x).classList.toggle('on',x===p);
  });
  const hdr=document.getElementById('mhdr');
  const fab=document.getElementById('mfab');
  hdr.style.display=(p==='deals')?'':'none';
  fab.style.display='none';
  if(p==='deals'){fab.style.display='flex';fab.onclick=openAdd;}
  else if(p==='gift'){fab.style.display='flex';fab.style.background='var(--gr-tx)';fab.onclick=openAddGift;}
  if(p==='deals'){bTabs();rDeals();updateDealAlert();}
  if(p==='dash')  rDash();
  if(p==='cal')   rCal();
  if(p==='gift')  rGift();
  if(p==='more'){hideMoreSub();}
}

['set-username','set-goal'].forEach(id=>{
  document.addEventListener('change',e=>{if(e.target.id===id)saveSettingsUI();});
});

initData();
document.getElementById('dlist').addEventListener('click',dealListClick);
sp('deals');
bTabs();rGift();rBanks();rCal();
updateDealAlert();
updateNotifLabel();
setInterval(()=>{updateDealAlert();},3600000);
</script>
